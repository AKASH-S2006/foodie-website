<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu">

        <button onclick="addToCart('Pizza',200)">Add to Cart</button>
    </div>

    <div class="menu-item">
        <img src="https://source.unsplash.com/200x150/?burger">
        <h3>Burger</h3>

    </div>

    <div class="menu-item">
        <img src="https://source.unsplash.com/200x150/?biryani">
        <h3>Biryani</h3>
        <p>₹250</p>
        <button onclick="addToCart('Biryani',250)">Add to Cart</button>
    </div>

    <div class="menu-item">
        <img src="https://source.unsplash.com/200x150/?pasta">
        <h3>Pasta</h3>
        <p>₹180</p>
        <button onclick="addToCart('Pasta',180)">Add to Cart</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
